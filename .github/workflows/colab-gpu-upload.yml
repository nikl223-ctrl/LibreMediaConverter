name: Upload Colab GPU result to Drive
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing Colab release tag
        required: true
        default: colab-gpu-20261014-103621
permissions:
  contents: read
jobs:
  upload:
    if: startsWith(github.event.release.tag_name || inputs.release_tag, 'colab-gpu-')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Install ffmpeg and rclone
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg rclone
      - name: Download segments from GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: |
          mkdir -p segments
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -D segments -p 'part_*.mp4'
          test "$(find segments -name 'part_*.mp4' | wc -l)" -eq 6
          find segments -name 'part_*.mp4' | sort | awk '{print "file '\''" ENVIRON["GITHUB_WORKSPACE"] "/" $0 "'\''"}' > concat.txt
          ffmpeg -hide_banner -y -f concat -safe 0 -i concat.txt -c copy Zoomania_4K_GPU_Test.mp4
      - name: Upload to Google Drive
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: |
          test -n "$GOOGLE_CLIENT_ID" && test -n "$GOOGLE_CLIENT_SECRET" && test -n "$GOOGLE_REFRESH_TOKEN"
          mkdir -p ~/.config/rclone
          python3 - <<'PY'
          import json,os,pathlib
          p=pathlib.Path.home()/'.config/rclone/rclone.conf'
          import urllib.parse,urllib.request,datetime
          params={'client_id':os.environ['GOOGLE_CLIENT_ID'],'client_secret':os.environ['GOOGLE_CLIENT_SECRET'],'refresh_token':os.environ['GOOGLE_REFRESH_TOKEN'],'grant_type':'refresh_token'}
          req=urllib.request.Request('https://oauth2.googleapis.com/token',data=urllib.parse.urlencode(params).encode())
          with urllib.request.urlopen(req,timeout=30) as response:
              refreshed=json.load(response)
          expiry=(datetime.datetime.now(datetime.timezone.utc)+datetime.timedelta(seconds=refreshed.get('expires_in',3600))).isoformat()
          token=json.dumps({'access_token':refreshed['access_token'],'token_type':'Bearer','refresh_token':os.environ['GOOGLE_REFRESH_TOKEN'],'expiry':expiry})
          p.write_text('[drive]\ntype = drive\nscope = drive\nclient_id = '+os.environ['GOOGLE_CLIENT_ID']+'\nclient_secret = '+os.environ['GOOGLE_CLIENT_SECRET']+'\ntoken = '+token+'\n')
          p.chmod(0o600)
          PY
          rclone copyto Zoomania_4K_GPU_Test.mp4 "drive:Video Converter/Fertig/Zoomania_4K_GPU_Test.mp4" --progress --retries 5
