name: Runner Hardware Probe

on:
  push:
    branches:
      - main
    paths:
      - "cpu-probe.txt"

jobs:
  probe-macos:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - name: Probe Apple Silicon VideoToolbox
        run: |
          set -uo pipefail
          echo "=== Hardware ==="
          uname -a
          sysctl -n machdep.cpu.brand_string 2>/dev/null || true
          system_profiler SPHardwareDataType SPDisplaysDataType 2>/dev/null | head -120 || true
          echo
          echo "=== FFmpeg ==="
          if ! command -v ffmpeg >/dev/null 2>&1; then
            brew install ffmpeg
          fi
          ffmpeg -version | head -3
          echo
          echo "=== VideoToolbox encoders ==="
          ffmpeg -hide_banner -encoders 2>/dev/null | grep -Ei 'h264_videotoolbox|hevc_videotoolbox' || true
          echo
          echo "=== 4K H264 VideoToolbox benchmark ==="
          set +e
          /usr/bin/time -p ffmpeg -hide_banner -loglevel info -stats \
            -f lavfi -i testsrc2=size=1920x1080:rate=30 \
            -t 10 \
            -vf "scale=3840:2160:flags=fast_bilinear,format=nv12" \
            -c:v h264_videotoolbox -b:v 30000000 \
            -f null - 2>&1 | tail -35
          exit 0
