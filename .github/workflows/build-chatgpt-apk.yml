name: Build 4K APK

on:
  push:
    branches: [chatgpt-4k-10gb]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '25'

      - name: Cache Gradle
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: chatgpt-4k-gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            chatgpt-4k-gradle-${{ runner.os }}-
            gradle-${{ runner.os }}-

      - name: Build ARM64 debug APK
        run: ./gradlew :app:assembleDebug -PabiFilters=arm64-v8a

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk 4K-Video-Converter.apk

      - name: Upload APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: 4K-Video-Converter-APK
          path: 4K-Video-Converter.apk
          if-no-files-found: error
