name: Drive 4K H264 Apple VideoToolbox

on:
  push:
    branches:
      - main
    paths:
      - "conversion-requests-macos/*.txt"

permissions:
  contents: read

jobs:
  convert:
    runs-on: macos-15
    timeout-minutes: 350

    env:
      RCLONE_CONFIG: /tmp/rclone.conf
      DEST_FOLDER: "Video Converter/Fertig"
      TARGET_BYTES: "28000000000"
      MAX_OUTPUT_BYTES: "30000000000"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Show Apple runner
        run: |
          sw_vers
          sysctl -n machdep.cpu.brand_string 2>/dev/null || true
          sysctl -n hw.model 2>/dev/null || true
          sysctl -n hw.ncpu 2>/dev/null || true
          uname -m

      - name: Install tools
        run: |
          set -e
          command -v ffmpeg >/dev/null 2>&1 || brew install ffmpeg
          command -v rclone >/dev/null 2>&1 || brew install rclone
          command -v jq >/dev/null 2>&1 || brew install jq
          ffmpeg -hide_banner -encoders 2>/dev/null | grep h264_videotoolbox
          rclone version

      - name: Configure Google Drive
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: |
          set -euo pipefail

          for var in GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET GOOGLE_REFRESH_TOKEN; do
            if [ -z "${!var:-}" ]; then
              echo "::error::Missing GitHub secret: $var"
              exit 1
            fi
          done

          client_project="${GOOGLE_CLIENT_ID%%-*}"
          if [ "$client_project" != "160241343420" ]; then
            echo "::error::Wrong Google OAuth project. This workflow only accepts the private repository OAuth client for project 160241343420; the public rclone client 202264815644 is forbidden."
            exit 1
          fi

          token_response=$(curl -fsS --request POST \
            --data-urlencode "client_id=$GOOGLE_CLIENT_ID" \
            --data-urlencode "client_secret=$GOOGLE_CLIENT_SECRET" \
            --data-urlencode "refresh_token=$GOOGLE_REFRESH_TOKEN" \
            --data-urlencode "grant_type=refresh_token" \
            https://oauth2.googleapis.com/token)

          access_token=$(printf '%s' "$token_response" | jq -r '.access_token // empty')
          expires_in=$(printf '%s' "$token_response" | jq -r '.expires_in // 3600')
          [ -n "$access_token" ] || { echo "::error::OAuth refresh failed."; exit 1; }
          echo "::add-mask::$access_token"

          expiry=$(python3 -c 'import sys,datetime; s=int(sys.argv[1]); print((datetime.datetime.now(datetime.timezone.utc)+datetime.timedelta(seconds=s)).strftime("%Y-%m-%dT%H:%M:%SZ"))' "$expires_in")

          token_json=$(jq -cn \
            --arg at "$access_token" \
            --arg rt "$GOOGLE_REFRESH_TOKEN" \
            --arg ex "$expiry" \
            '{access_token:$at,token_type:"Bearer",refresh_token:$rt,expiry:$ex}')

          rclone config create drive drive \
            client_id "$GOOGLE_CLIENT_ID" \
            client_secret "$GOOGLE_CLIENT_SECRET" \
            scope drive \
            token "$token_json" \
            --non-interactive >/dev/null

          rclone about drive: >/dev/null

      - name: Read request and download source
        id: input
        run: |
          set -euo pipefail

          request_file=$(git show --pretty="" --name-only "$GITHUB_SHA" \
            | grep -E '^conversion-requests-macos/[^/]+\.txt$' \
            | tail -n 1 || true)

          [ -n "$request_file" ] && [ -f "$request_file" ] || {
            echo "::error::No macOS conversion request found."
            exit 1
          }

          raw=$(sed -n '1p' "$request_file" | tr -d '\r\n\t ')
          audio_channels=$(sed -n 's/^AUDIO_CHANNELS=//p' "$request_file" | tail -n 1 | tr -d '\r\n\t ' || true)
          audio_bitrate=$(sed -n 's/^AUDIO_BITRATE=//p' "$request_file" | tail -n 1 | tr -d '\r\n\t ' || true)
          [ -n "$audio_channels" ] || audio_channels=6
          [ -n "$audio_bitrate" ] || audio_bitrate=384k

          if [[ "$raw" =~ /d/([^/?]+) ]]; then
            file_id="${BASH_REMATCH[1]}"
          elif [[ "$raw" =~ [\?\&]id=([^\&]+) ]]; then
            file_id="${BASH_REMATCH[1]}"
          else
            file_id="$raw"
          fi

          input_dir="$RUNNER_TEMP/video-input"
          mkdir -p "$input_dir"

          start_epoch=$(date +%s)
          rclone backend copyid drive: "$file_id" "$input_dir/" \
            --stats 10s --stats-one-line \
            --retries 5 --low-level-retries 10
          end_epoch=$(date +%s)
          elapsed=$(( end_epoch - start_epoch ))
          [ "$elapsed" -gt 0 ] || elapsed=1

          input_file=$(ls -1t "$input_dir"/* 2>/dev/null | head -n 1 || true)
          [ -n "$input_file" ] && [ -s "$input_file" ] || {
            echo "::error::Source file was not downloaded."
            exit 1
          }

          source_size=$(stat -f '%z' "$input_file")
          avg_mbps=$(python3 -c 'import sys; b=int(sys.argv[1]); s=max(1,int(sys.argv[2])); print(round((b*8/s)/1000000,2))' "$source_size" "$elapsed")

          echo "Downloaded: $(basename "$input_file")"
          echo "Average download: $avg_mbps Mbit/s"

          echo "input_file=$input_file" >> "$GITHUB_OUTPUT"
          echo "download_mbps=$avg_mbps" >> "$GITHUB_OUTPUT"
          echo "audio_channels=$audio_channels" >> "$GITHUB_OUTPUT"
          echo "audio_bitrate=$audio_bitrate" >> "$GITHUB_OUTPUT"

      - name: Probe source and calculate bitrate
        id: probe
        env:
          INPUT_FILE: ${{ steps.input.outputs.input_file }}
        run: |
          set -euo pipefail

          duration=$(ffprobe -v error -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 "$INPUT_FILE" | head -n 1)

          video_bps=$(python3 -c \
            'import sys; d=float(sys.argv[1]); t=int(sys.argv[2]); a=384000; print(max(500000,min(int((t*8/d)*0.985-a),100000000)))' \
            "$duration" "$TARGET_BYTES")

          base=$(basename "$INPUT_FILE")
          stem="${base%.*}"
          ext=$(printf '%s' "${base##*.}" | tr '[:upper:]' '[:lower:]')
          if [ "$base" = "$stem" ]; then
            output_name="${base}.mp4"
          elif [ "$ext" = "mp4" ]; then
            output_name="$base"
          else
            output_name="${stem}.mp4"
          fi
          output_name=$(printf '%s' "$output_name" | tr '/\\\r\n\t' '____')

          echo "Duration: $duration sec"
          echo "Target bitrate: $(( video_bps / 1000000 )) Mbit/s"
          echo "Output: $output_name"

          echo "duration=$duration" >> "$GITHUB_OUTPUT"
          echo "video_bps=$video_bps" >> "$GITHUB_OUTPUT"
          echo "output_name=$output_name" >> "$GITHUB_OUTPUT"

      - name: Convert 4K with Apple VideoToolbox and stream to Drive
        id: convert
        env:
          INPUT_FILE: ${{ steps.input.outputs.input_file }}
          OUTPUT_NAME: ${{ steps.probe.outputs.output_name }}
          VIDEO_BPS: ${{ steps.probe.outputs.video_bps }}
          SOURCE_DURATION: ${{ steps.probe.outputs.duration }}
          AUDIO_CHANNELS: ${{ steps.input.outputs.audio_channels }}
          AUDIO_BITRATE: ${{ steps.input.outputs.audio_bitrate }}
        run: |
          set -euo pipefail

          dest_path="${DEST_FOLDER%/}/$OUTPUT_NAME"
          rclone mkdir "drive:${DEST_FOLDER%/}"

          echo "============================================================"
          echo "APPLE VIDEOTOOLBOX 4K H.264 — live progress"
          echo "============================================================"

          progress_fifo="$RUNNER_TEMP/ffmpeg-progress.fifo"
          rm -f "$progress_fifo"
          mkfifo "$progress_fifo"

          awk -F= -v dur="$SOURCE_DURATION" '
            function fmt(sec, h,m,s) {
              if (sec < 0) sec=0
              h=int(sec/3600); m=int((sec%3600)/60); s=int(sec%60)
              return sprintf("%02d:%02d:%02d",h,m,s)
            }
            $1=="fps" { fps=$2; next }
            $1=="out_time" {
              n=split($2,a,":")
              if (n==3) pos=(a[1]*3600)+(a[2]*60)+a[3]
              out=$2; next
            }
            $1=="speed" { speed=$2; next }
            $1=="progress" {
              sf=speed; gsub(/x/,"",sf); sf+=0
              pct=(dur>0 ? (pos/dur)*100 : 0); if (pct>100) pct=100
              eta=(sf>0 && dur>pos ? (dur-pos)/sf : 0)
              printf("LIVE | %5.1f%% | FPS=%s | SPEED=%s | VIDEO=%s | ETA=%s\n",pct,fps,speed,out,fmt(eta))
              fflush(); next
            }
          ' < "$progress_fifo" &
          progress_pid=$!

          set +e
          ffmpeg \
            -hide_banner -loglevel warning -nostats -stats_period 10 \
            -progress "$progress_fifo" \
            -i "$INPUT_FILE" \
            -map 0:v:0 -map '0:a?' \
            -vf "scale=3840:2160:force_original_aspect_ratio=decrease,pad=3840:2160:(ow-iw)/2:(oh-ih)/2,setsar=1" \
            -c:v h264_videotoolbox \
            -profile:v high \
            -pix_fmt yuv420p \
            -b:v "$VIDEO_BPS" \
            -maxrate "$VIDEO_BPS" \
            -c:a aac \
            -ac "$AUDIO_CHANNELS" \
            -b:a "$AUDIO_BITRATE" \
            -movflags +frag_keyframe+empty_moov+default_base_moof \
            -f mp4 pipe:1 \
          | rclone rcat "drive:$dest_path" \
              --drive-chunk-size 256M \
              --tpslimit 8 --tpslimit-burst 8 \
              --stats 10s --stats-one-line \
              --retries 10 --retries-sleep 10s --low-level-retries 50

          pipe_status=( "${PIPESTATUS[@]}" )
          wait "$progress_pid" >/dev/null 2>&1 || true
          rm -f "$progress_fifo"
          set -e

          ffmpeg_status="${pipe_status[0]:-1}"
          rclone_status="${pipe_status[1]:-1}"
          if [ "$ffmpeg_status" -ne 0 ] || [ "$rclone_status" -ne 0 ]; then
            rclone deletefile "drive:$dest_path" >/dev/null 2>&1 || true
            echo "::error::VideoToolbox conversion or Drive upload failed."
            exit 1
          fi

          final_size=$(rclone size --json "drive:$dest_path" | jq -r '.bytes // 0')
          if [ "$final_size" -le 0 ] || [ "$final_size" -gt "$MAX_OUTPUT_BYTES" ]; then
            echo "::error::Final output size invalid or above 30 GB."
            exit 1
          fi

          echo "dest_path=$dest_path" >> "$GITHUB_OUTPUT"
          echo "final_size=$final_size" >> "$GITHUB_OUTPUT"

      - name: Summary
        env:
          DEST_PATH: ${{ steps.convert.outputs.dest_path }}
          FINAL_SIZE: ${{ steps.convert.outputs.final_size }}
          VIDEO_BPS: ${{ steps.probe.outputs.video_bps }}
          AUDIO_CHANNELS: ${{ steps.input.outputs.audio_channels }}
          AUDIO_BITRATE: ${{ steps.input.outputs.audio_bitrate }}
          DOWNLOAD_MBPS: ${{ steps.input.outputs.download_mbps }}
        run: |
          size_gb=$(python3 -c 'import sys; print(round(int(sys.argv[1])/1000000000,3))' "$FINAL_SIZE")
          {
            echo "## Apple VideoToolbox 4K H.264 complete"
            echo "- Output: `$DEST_PATH`"
            echo "- Size: $size_gb GB"
            echo "- Video: 3840x2160 H.264 VideoToolbox @ $(( VIDEO_BPS / 1000000 )) Mbit/s"
            echo "- Audio: AAC $AUDIO_BITRATE, $AUDIO_CHANNELS channels"
            echo "- Source download: $DOWNLOAD_MBPS Mbit/s"
          } >> "$GITHUB_STEP_SUMMARY"
