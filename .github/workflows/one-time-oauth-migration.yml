name: One-time encrypted OAuth migration

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-encrypted:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Encrypt private Drive OAuth settings for proxy server
        shell: bash
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          PROXY_PUBLIC_KEY_B64: 
        run: |
          set -euo pipefail
          umask 077
          for var in GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET GOOGLE_REFRESH_TOKEN; do
            [ -n "${!var:-}" ] || { echo "::error::Missing $var"; exit 1; }
          done
          printf '%s' "$PROXY_PUBLIC_KEY_B64" | base64 -d > public.pem
          jq -cn \
            --arg client_id "$GOOGLE_CLIENT_ID" \
            --arg client_secret "$GOOGLE_CLIENT_SECRET" \
            --arg refresh_token "$GOOGLE_REFRESH_TOKEN" \
            '{client_id:$client_id,client_secret:$client_secret,refresh_token:$refresh_token}' > oauth.json
          openssl pkeyutl -encrypt -pubin -inkey public.pem \
            -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 \
            -in oauth.json -out private-oauth.enc
          rm -f oauth.json public.pem

      - name: Upload encrypted settings
        uses: actions/upload-artifact@v4
        with:
          name: proxy-private-oauth
          path: private-oauth.enc
          retention-days: 1
          if-no-files-found: error
