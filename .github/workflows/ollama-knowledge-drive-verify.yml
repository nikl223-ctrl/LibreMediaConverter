name: Ollama Knowledge Drive Account Verification
on:
  push:
    branches: [main]
    paths: ['.github/workflows/ollama-knowledge-drive-verify.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-oauth:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify existing Google OAuth belongs to requested Drive account
        shell: bash
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          for key in GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET GOOGLE_REFRESH_TOKEN; do
             test -n "${!key:-}" || { echo "MISSING_OAUTH_SECRET_NAME=$key"; exit 1; }
          done
          body="$(curl -fsS --retry 2 -X POST --data-urlencode "client_id=$GOOGLE_CLIENT_ID" --data-urlencode "client_secret=$GOOGLE_CLIENT_SECRET" --data-urlencode "refresh_token=$GOOGLE_REFRESH_TOKEN" --data-urlencode "grant_type=refresh_token" https://oauth2.googleapis.com/token)"
          access="$(printf '%s' "$body" | python3 -c 'import json,sys;print(json.load(sys.stdin).get("access_token",""))')"
          test -n "$access" || { echo 'TOKEN_REFRESH_FAILED=true'; exit 1; }
          echo "::add-mask::$access"
          about="$(curl -fsS --retry 2 --header "Authorization: Bearer $access" 'https://www.googleapis.com/drive/v3/about?fields=user(emailAddress),storageQuota(limit,usage)')"
          export ABOUT_JSON="$about"
          python3 - <<'PY'
          import json,os
          data=json.loads(os.environ['ABOUT_JSON'])
          email=(data.get('user') or {}).get('emailAddress','').lower()
          match=email=='convertvideo450@gmail.com'
          print('REQUESTED_DRIVE_ACCOUNT_MATCH='+str(match).lower())
          quota=data.get('storageQuota') or {}
          remaining=int(quota.get('limit',0))-int(quota.get('usage',0))
          print('STORAGE_REMAINING_AT_LEAST_1MB='+str(remaining>1024*1024).lower())
          if not match: raise SystemExit('Stop: configured OAuth account differs from requested account.')
          PY
          echo 'EXISTING_OAUTH_CONFIRMED=true'
