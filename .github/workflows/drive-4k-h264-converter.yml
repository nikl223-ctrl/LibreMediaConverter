name: Drive 4K H264 Video Converter

on:
  push:
    branches:
      - main
    paths:
      - "conversion-requests-h264/*.txt"

permissions:
  contents: read

jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    env:
      RCLONE_CONFIG: /tmp/rclone.conf
      DEST_FOLDER: "Video Converter/Fertig"
      MAX_OUTPUT_BYTES: "30000000000"
      TARGET_BYTES: "28000000000"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Show runner CPU
        run: |
          echo "=== Runner CPU ==="
          lscpu | grep -E 'Model name|CPU\(s\)|Thread|Core|Socket|CPU max MHz' || true

      - name: Install tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg rclone jq curl ca-certificates

      - name: Configure Google Drive
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: |
          set -euo pipefail

          for var in GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET GOOGLE_REFRESH_TOKEN; do
            if [ -z "${!var:-}" ]; then
              echo "::error::Missing GitHub secret: $var"
              exit 1
            fi
          done

          token_response=$(curl -fsS --request POST \
            --data-urlencode "client_id=$GOOGLE_CLIENT_ID" \
            --data-urlencode "client_secret=$GOOGLE_CLIENT_SECRET" \
            --data-urlencode "refresh_token=$GOOGLE_REFRESH_TOKEN" \
            --data-urlencode "grant_type=refresh_token" \
            https://oauth2.googleapis.com/token)

          access_token=$(printf '%s' "$token_response" | jq -r '.access_token // empty')
          expires_in=$(printf '%s' "$token_response" | jq -r '.expires_in // 3600')

          if [ -z "$access_token" ]; then
            echo "::error::Google OAuth refresh failed."
            exit 1
          fi

          echo "::add-mask::$access_token"
          expiry=$(date -u -d "+${expires_in} seconds" '+%Y-%m-%dT%H:%M:%SZ')
          token_json=$(jq -cn \
            --arg at "$access_token" \
            --arg rt "$GOOGLE_REFRESH_TOKEN" \
            --arg ex "$expiry" \
            '{access_token:$at,token_type:"Bearer",refresh_token:$rt,expiry:$ex}')

          rclone config create drive drive \
            client_id "$GOOGLE_CLIENT_ID" \
            client_secret "$GOOGLE_CLIENT_SECRET" \
            scope drive \
            token "$token_json" \
            --non-interactive >/dev/null

          rclone about drive: >/dev/null

      - name: Read request and download source
        id: input
        run: |
          set -euo pipefail

          request_file=$(git show --pretty="" --name-only "$GITHUB_SHA" \
            | grep -E '^conversion-requests-h264/[^/]+\.txt$' \
            | tail -n 1 || true)

          if [ -z "$request_file" ] || [ ! -f "$request_file" ]; then
            echo "::error::No H264 conversion request found."
            exit 1
          fi

          raw=$(sed -n '1p' "$request_file" | tr -d '\r\n\t ')

          if [[ "$raw" =~ /d/([^/?]+) ]]; then
            file_id="${BASH_REMATCH[1]}"
          elif [[ "$raw" =~ [\?\&]id=([^\&]+) ]]; then
            file_id="${BASH_REMATCH[1]}"
          else
            file_id="$raw"
          fi

          input_dir="$RUNNER_TEMP/video-input"
          mkdir -p "$input_dir"

          echo "Downloading source from Google Drive..."
          start_epoch=$(date +%s)

          rclone backend copyid drive: "$file_id" "$input_dir/" \
            --stats 10s \
            --stats-one-line \
            --retries 5 \
            --low-level-retries 10

          end_epoch=$(date +%s)
          elapsed=$(( end_epoch - start_epoch ))
          [ "$elapsed" -gt 0 ] || elapsed=1

          input_file=$(find "$input_dir" -maxdepth 1 -type f -printf '%T@ %p\n' \
            | sort -nr | head -n 1 | cut -d' ' -f2-)

          if [ -z "$input_file" ] || [ ! -s "$input_file" ]; then
            echo "::error::Source file was not downloaded."
            exit 1
          fi

          source_size=$(stat -c '%s' "$input_file")
          avg_mbps=$(python3 -c 'import sys; b=int(sys.argv[1]); s=max(1,int(sys.argv[2])); print(round((b*8/s)/1000000,2))' "$source_size" "$elapsed")

          echo "Downloaded: $(basename "$input_file")"
          echo "Average download speed: $avg_mbps Mbit/s"

          echo "input_file=$input_file" >> "$GITHUB_OUTPUT"
          echo "download_mbps=$avg_mbps" >> "$GITHUB_OUTPUT"

      - name: Probe source and calculate bitrate
        id: probe
        env:
          INPUT_FILE: ${{ steps.input.outputs.input_file }}
        run: |
          set -euo pipefail

          duration=$(ffprobe -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            "$INPUT_FILE" | head -n 1)

          python3 -c 'import math,sys; d=float(sys.argv[1]); assert d>0 and math.isfinite(d)' "$duration"

          video_bps=$(python3 -c \
            'import sys; d=float(sys.argv[1]); t=int(sys.argv[2]); a=192000; print(max(500000,min(int((t*8/d)*0.985-a),100000000)))' \
            "$duration" "$TARGET_BYTES")

          base=$(basename "$INPUT_FILE")
          stem="${base%.*}"
          ext="${base##*.}"

          if [ "$base" = "$stem" ]; then
            output_name="${base}.mp4"
          elif [ "${ext,,}" = "mp4" ]; then
            output_name="$base"
          else
            output_name="${stem}.mp4"
          fi

          output_name=$(printf '%s' "$output_name" | tr '/\\\r\n\t' '____')

          duration_hms=$(python3 -c 'import sys; s=float(sys.argv[1]); h=int(s//3600); m=int((s%3600)//60); sec=int(s%60); print(f"{h:02d}:{m:02d}:{sec:02d}")' "$duration")

          echo "Source duration: $duration_hms"
          echo "Target bitrate: $(( video_bps / 1000000 )) Mbit/s"
          echo "Output: $output_name"

          echo "duration=$duration" >> "$GITHUB_OUTPUT"
          echo "video_bps=$video_bps" >> "$GITHUB_OUTPUT"
          echo "output_name=$output_name" >> "$GITHUB_OUTPUT"

      - name: Convert 4K H264 ultrafast and stream to Drive
        id: convert
        env:
          INPUT_FILE: ${{ steps.input.outputs.input_file }}
          OUTPUT_NAME: ${{ steps.probe.outputs.output_name }}
          VIDEO_BPS: ${{ steps.probe.outputs.video_bps }}
          SOURCE_DURATION: ${{ steps.probe.outputs.duration }}
        run: |
          set -euo pipefail

          dest_path="${DEST_FOLDER%/}/$OUTPUT_NAME"
          rclone mkdir "drive:${DEST_FOLDER%/}"

          bitrate="$VIDEO_BPS"
          maxrate=$(( bitrate * 12 / 10 ))
          bufsize=$(( bitrate * 2 ))

          echo "============================================================"
          echo "LIVE H.264 ENCODE — updates roughly every 10 seconds"
          echo "============================================================"

          progress_fifo="$RUNNER_TEMP/ffmpeg-progress.fifo"
          rm -f "$progress_fifo"
          mkfifo "$progress_fifo"

          stdbuf -oL awk -F= -v dur="$SOURCE_DURATION" '
            function fmt(sec, h,m,s) {
              if (sec < 0) sec=0
              h=int(sec/3600)
              m=int((sec%3600)/60)
              s=int(sec%60)
              return sprintf("%02d:%02d:%02d",h,m,s)
            }
            $1=="frame" { frame=$2; next }
            $1=="fps" { fps=$2; next }
            $1=="out_time" {
              out=$2
              n=split(out,a,":")
              if (n==3) pos=(a[1]*3600)+(a[2]*60)+a[3]
              next
            }
            $1=="speed" { speed=$2; next }
            $1=="progress" {
              sf=speed
              gsub(/x/,"",sf)
              sf+=0
              pct=(dur>0 ? (pos/dur)*100 : 0)
              if (pct>100) pct=100
              eta=(sf>0 && dur>pos ? (dur-pos)/sf : 0)
              printf("LIVE | %5.1f%% | FPS=%s | SPEED=%s | VIDEO=%s | ETA=%s\n", pct, fps, speed, out, fmt(eta))
              fflush()
              next
            }
          ' < "$progress_fifo" &
          progress_pid=$!

          set +e

          ffmpeg \
            -hide_banner \
            -loglevel warning \
            -nostats \
            -stats_period 10 \
            -progress "$progress_fifo" \
            -i "$INPUT_FILE" \
            -map 0:v:0 -map '0:a?' \
            -vf "scale=3840:2160:force_original_aspect_ratio=decrease,pad=3840:2160:(ow-iw)/2:(oh-ih)/2,setsar=1" \
            -c:v libx264 \
            -preset ultrafast \
            -profile:v high \
            -level:v 5.1 \
            -pix_fmt yuv420p \
            -b:v "$bitrate" \
            -maxrate "$maxrate" \
            -bufsize "$bufsize" \
            -c:a aac \
            -b:a 192k \
            -movflags +frag_keyframe+empty_moov+default_base_moof \
            -f mp4 pipe:1 \
            2> >(stdbuf -oL sed -u 's/^/[ffmpeg] /' >&2) \
          | rclone rcat "drive:$dest_path" \
              --drive-chunk-size 64M \
              --stats 10s \
              --stats-one-line \
              --stats-log-level NOTICE \
              --log-level NOTICE \
              --retries 5 \
              --low-level-retries 20

          pipe_status=( "${PIPESTATUS[@]}" )
          wait "$progress_pid" >/dev/null 2>&1 || true
          rm -f "$progress_fifo"
          set -e

          ffmpeg_status="${pipe_status[0]:-1}"
          rclone_status="${pipe_status[1]:-1}"

          if [ "$ffmpeg_status" -ne 0 ] || [ "$rclone_status" -ne 0 ]; then
            rclone deletefile "drive:$dest_path" >/dev/null 2>&1 || true
            echo "::error::H264 conversion or Drive upload failed."
            exit 1
          fi

          final_size=$(rclone size --json "drive:$dest_path" | jq -r '.bytes // 0')

          if [ "$final_size" -le 0 ] || [ "$final_size" -gt "$MAX_OUTPUT_BYTES" ]; then
            echo "::error::Final file size invalid or above 30 GB."
            exit 1
          fi

          echo "dest_path=$dest_path" >> "$GITHUB_OUTPUT"
          echo "final_size=$final_size" >> "$GITHUB_OUTPUT"

      - name: Summary
        env:
          DEST_PATH: ${{ steps.convert.outputs.dest_path }}
          FINAL_SIZE: ${{ steps.convert.outputs.final_size }}
          DOWNLOAD_MBPS: ${{ steps.input.outputs.download_mbps }}
        run: |
          size_gb=$(python3 -c 'import sys; print(round(int(sys.argv[1])/1000000000,3))' "$FINAL_SIZE")

          {
            echo "## 4K H.264 conversion complete"
            echo "- Output: \`$DEST_PATH\`"
            echo "- Size: $size_gb GB"
            echo "- Video: 3840x2160 H.264"
            echo "- Preset: ultrafast"
            echo "- Audio: AAC 192 kbit/s"
            echo "- Average source download: $DOWNLOAD_MBPS Mbit/s"
          } >> "$GITHUB_STEP_SUMMARY"
