name: One-time encrypted Drive OAuth export for proxy
on:
  push:
    paths:
      - .github/workflows/one-time-proxy-drive-oauth-export.yml
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Encrypt OAuth values to proxy public key
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          cat > public.pem <<'PUBLIC_KEY'
          -----BEGIN PUBLIC KEY-----
          MIICIjANBgkqhkiG9w0BAQEFAAOCAg8AMIICCgKCAgEAwx/usoWszsh0UVVoAypx
          RuvZiZOqh87IhdYVo8wADEvrosgMOpzXcA4UYZrb06FxATjdIJW4C/iSUGe68Mjn
          TO5EBwQST0NWYLBdLzD51/Xyj03M/ojZzhu4F7qZ696l2NskGGse08Hr12wJB7Uu
          lS7/vtxz7/stgGGmsTBkwBj0isYGKCccQj0RhCpxQKrIiym8FdeKULIrwBJRDQU/
          W2JQI1J3gzL48SGSFMrS01cp4QO1XDZyxGEE3DNSbhha7NcL0NvqJnbSJX6zCc2u
          HXoRvGiqXZKoepELjFJsN++BT+4iCGms4wu85aeEcDsnSGLgIpPv/s5564Bb2aZn
          JY7Vswxiyc4DZvT536dYl+9JV/mH5uyYT2E3tPGLr+DSLjtyfnA0kLTV6+Ap87uy
          IaWRHI9VNk8LdqS1DGWZvWqaXuC16qW/uhtut09oGsQvNoZkBZCdkWFt8rJ3R1bT
          ZoQT7OAKRs1oNEv8FkzU0nogDZN5nRrCp60GXmqDaODHUyBXJXsmwSnMnEXhDdN5
          tnte+2LmWW3nfaJgNAl1GN56uVp/orDfqx1lpAgWyZO4qLdqzwjKVjotwBqb9xAH
          2hcEpfTNrkmAGbHdG1S3rpxBBPksRVAPKqZrTGvfMYLQSVJt0FxEjtgT4Uz5UNV0
          EWnF22JLuXM4DivbDhOv0MECAwEAAQ==
          -----END PUBLIC KEY-----
          PUBLIC_KEY
          python3 - <<'PY'
          import json, os
          names = ('GOOGLE_CLIENT_ID', 'GOOGLE_CLIENT_SECRET', 'GOOGLE_REFRESH_TOKEN')
          if not all(os.environ.get(name) for name in names):
              raise SystemExit('One or more Drive OAuth secrets are missing')
          if not os.environ['GOOGLE_CLIENT_ID'].startswith('160241343420-'):
              raise SystemExit('Drive OAuth client is not the expected private project')
          with open('oauth.json', 'w') as file:
              json.dump({name: os.environ[name] for name in names}, file, separators=(',', ':'))
          PY
          openssl pkeyutl -encrypt -pubin -inkey public.pem -in oauth.json -out private-oauth.enc -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256
          rm oauth.json
      - uses: actions/upload-artifact@v4
        with:
          name: private-oauth-for-proxy
          path: private-oauth.enc
          retention-days: 1
          if-no-files-found: error
