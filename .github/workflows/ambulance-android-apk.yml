name: Rettungsdienst Simulator - Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - ambulance-2012-android
    paths:
      - "Ambulance2012Android/project.godot"
      - "Ambulance2012Android/main.tscn"
      - "Ambulance2012Android/export_presets.cfg"
      - "Ambulance2012Android/scripts/**"
      - "Ambulance2012Android/tools/test_ambulance.gd"
      - ".github/workflows/ambulance-android-apk.yml"

permissions:
  contents: read

concurrency:
  group: ambulance-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    name: Compile rescue city and build ARM64 Android package
    steps:
      - name: Checkout Android source code
        uses: actions/checkout@v4

      - name: Install Java 17 for Android
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Android platform tools
        shell: bash
        run: |
          set -euxo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -n1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Download Godot 4.5.2 editor and matching Android templates
        shell: bash
        run: |
          set -euxo pipefail
          wget -q -O "$RUNNER_TEMP/godot.zip" \
            "https://github.com/godotengine/godot/releases/download/4.5.2-stable/Godot_v4.5.2-stable_linux.x86_64.zip"
          wget -q -O "$RUNNER_TEMP/export.tpz" \
            "https://github.com/godotengine/godot/releases/download/4.5.2-stable/Godot_v4.5.2-stable_export_templates.tpz"
          mkdir -p "$RUNNER_TEMP/godot" "$RUNNER_TEMP/templates"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          unzip -q "$RUNNER_TEMP/export.tpz" -d "$RUNNER_TEMP/templates"
          sudo install -m 0755 "$RUNNER_TEMP/godot/Godot_v4.5.2-stable_linux.x86_64" /usr/local/bin/godot
          mkdir -p "$HOME/.local/share/godot/export_templates/4.5.2.stable"
          cp "$RUNNER_TEMP/templates/templates/"* "$HOME/.local/share/godot/export_templates/4.5.2.stable/"
          godot --version

      - name: Configure Android signing
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$RUNNER_TEMP/rescue-debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/rescue-debug.keystore" \
            -storepass android -keypass android \
            -alias androiddebugkey -keyalg RSA -keysize 2048 \
            -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Import assets and check GDScript syntax
        shell: bash
        run: |
          set -o pipefail
          godot --headless --editor --path Ambulance2012Android --quit 2>&1 | tee "$RUNNER_TEMP/parse.log"
          if grep -E 'SCRIPT ERROR|Parse Error|Failed to load script' "$RUNNER_TEMP/parse.log"; then
            exit 1
          fi

      - name: Run ambulance driving and emergency mission gameplay test
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path Ambulance2012Android --script res://tools/test_ambulance.gd 2>&1 | tee "$RUNNER_TEMP/rescue-test.log"
          grep -q 'AMBULANCE_SMOKE_PASS' "$RUNNER_TEMP/rescue-test.log"
          if grep -E 'SCRIPT ERROR|Invalid call|Invalid assignment|Parse Error' "$RUNNER_TEMP/rescue-test.log"; then
            exit 1
          fi

      - name: Build, sign and verify Android APK
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p Ambulance2012Android/build
          godot --headless --path Ambulance2012Android --export-debug "Android" "build/RettungsdienstSimulator.apk"
          test -s Ambulance2012Android/build/RettungsdienstSimulator.apk
          unzip -t Ambulance2012Android/build/RettungsdienstSimulator.apk | tail -n1
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose Ambulance2012Android/build/RettungsdienstSimulator.apk
          ls -lh Ambulance2012Android/build/RettungsdienstSimulator.apk

      - name: Publish APK for Samsung Galaxy S24 Ultra
        uses: actions/upload-artifact@v4
        with:
          name: RettungsdienstSimulator-Android-APK
          path: Ambulance2012Android/build/RettungsdienstSimulator.apk
          retention-days: 30
          if-no-files-found: error
