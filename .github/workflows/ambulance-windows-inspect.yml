name: Ambulance 2012 - Windows Asset Inspection

on:
  workflow_dispatch:
  push:
    branches: [ambulance-2012-android]
    paths:
      - "Ambulance2012Android/tools/**"
      - ".github/workflows/ambulance-windows-inspect.yml"

permissions:
  contents: read

concurrency:
  group: ambulance-windows-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  original-assets:
    runs-on: windows-2022
    timeout-minutes: 35
    name: Windows Worker - inspect 2012 rescue simulator assets
    env:
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Install image and original audio inspection tools
        shell: pwsh
        run: |
          python -m pip install --upgrade Pillow
          $url = 'https://github.com/vgmstream/vgmstream/releases/download/r2117/vgmstream-win64.zip'
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP/vgmstream.zip" -TimeoutSec 180
          Expand-Archive -LiteralPath "$env:RUNNER_TEMP/vgmstream.zip" -DestinationPath "$env:RUNNER_TEMP/vgmstream" -Force
          $cli = Get-ChildItem -Path "$env:RUNNER_TEMP/vgmstream" -Filter 'vgmstream-cli.exe' -Recurse | Select-Object -First 1
          if ($null -eq $cli) { throw 'vgmstream-cli missing' }
          "VGMSTREAM_CLI=$($cli.FullName)" >> $env:GITHUB_ENV
          Write-Host 'Original DDS and FMOD media audit tools ready'
      - name: Inspect game install without executing EXEs
        shell: pwsh
        run: ./Ambulance2012Android/tools/windows_inspect.ps1
      - name: Upload format report (no original game files)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Ambulance2012-Windows-Asset-Report
          path: Ambulance2012Android/port-audit/report/*.json
          retention-days: 30
          if-no-files-found: warn
