name: Cancel obsolete ATS inspections
on:
  push:
    paths:
      - .github/workflows/cancel-old-ats.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  cancel-obsolete:
    runs-on: macos-latest
    timeout-minutes: 5
    steps:
      - name: Cancel only obsolete ATS runs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          for id in 39278422561 39279920247; do
            echo "Attempting normal cancellation for $id"
            if gh api --method POST "repos/$GH_REPO/actions/runs/$id/cancel"; then
              echo "Normal cancellation accepted: $id"
            else
              echo "Normal cancellation did not succeed; trying force cancel: $id"
              gh api --method POST "repos/$GH_REPO/actions/runs/$id/force-cancel" || true
            fi
          done
