name: Reusable 16K Streaming Merge

on:
  workflow_call:

jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      RCLONE_CONFIG: /tmp/rclone.conf
      PARTS_FOLDER: "Video Converter/Fertig/.4k-parts"
      DEST_FOLDER: "Video Converter/Fertig"
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg jq curl ca-certificates fuse3
          curl -fsSL https://rclone.org/install.sh | sudo bash
      - name: Configure Drive
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          client_project="${GOOGLE_CLIENT_ID%%-*}"
          test "$client_project" = "160241343420"
          test "$client_project" != "202264815644"
          token_response=$(curl -fsS --request POST --data-urlencode "client_id=$GOOGLE_CLIENT_ID" --data-urlencode "client_secret=$GOOGLE_CLIENT_SECRET" --data-urlencode "refresh_token=$GOOGLE_REFRESH_TOKEN" --data-urlencode "grant_type=refresh_token" https://oauth2.googleapis.com/token)
          access_token=$(printf '%s' "$token_response" | jq -r '.access_token // empty')
          test -n "$access_token"
          echo "::add-mask::$access_token"
          expiry=$(date -u -d "+3600 seconds" '+%Y-%m-%dT%H:%M:%SZ')
          token_json=$(jq -cn --arg at "$access_token" --arg rt "$GOOGLE_REFRESH_TOKEN" --arg ex "$expiry" '{access_token:$at,token_type:"Bearer",refresh_token:$rt,expiry:$ex}')
          rclone config create drive drive client_id "$GOOGLE_CLIENT_ID" client_secret "$GOOGLE_CLIENT_SECRET" scope drive token "$token_json" --non-interactive >/dev/null
      - name: Stream merge Drive to Drive without local movie storage
        run: |
          set -euo pipefail
          PIPE=/tmp/parts-stream.ts
          rm -f "$PIPE"
          mkfifo "$PIPE"

          (
            for n in $(seq -w 0 19); do
              remote="drive:$PARTS_FOLDER/Die_Monster_AG_16K_20M_part_${n}.mp4"
              echo "Streaming part ${n} from Drive"
              rclone cat "$remote" | ffmpeg -hide_banner -loglevel warning -i pipe:0 -map 0:v:0 -map 0:a:0? -c copy -f mpegts pipe:1
            done
          ) > "$PIPE" &
          PRODUCER_PID=$!

          set +e
          ffmpeg -hide_banner -loglevel warning -f mpegts -i "$PIPE" -map 0:v:0 -map 0:a:0? -c copy \
            -movflags +frag_keyframe+empty_moov+default_base_moof -f mp4 pipe:1 | \
            rclone rcat "drive:$DEST_FOLDER/Oben_16K_20M.mp4" --stats 10s
          MERGE_RC=${PIPESTATUS[0]}
          UPLOAD_RC=${PIPESTATUS[1]}
          wait "$PRODUCER_PID"
          PRODUCER_RC=$?
          set -e

          rm -f "$PIPE"
          test "$PRODUCER_RC" -eq 0
          test "$MERGE_RC" -eq 0
          test "$UPLOAD_RC" -eq 0

          bytes=$(rclone size "drive:$DEST_FOLDER/Oben_16K_20M.mp4" --json | jq -r '.bytes')
          echo "final_bytes=$bytes"
          test "$bytes" -gt 0
          test "$bytes" -le 100000000000
      - name: Cleanup parts
        if: success()
        run: |
          for n in $(seq -w 0 19); do rclone deletefile "drive:$PARTS_FOLDER/Die_Monster_AG_16K_20M_part_${n}.mp4" || true; done
