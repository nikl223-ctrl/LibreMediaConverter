name: Reusable 4K Merge

on:
  workflow_call:

jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      RCLONE_CONFIG: /tmp/rclone.conf
      PARTS_FOLDER: "Video Converter/Fertig/.4k-parts"
      DEST_FOLDER: "Video Converter/Fertig"
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg jq curl ca-certificates
          curl -fsSL https://rclone.org/install.sh | sudo bash
      - name: Configure Drive
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          client_project="${GOOGLE_CLIENT_ID%%-*}"
          test "$client_project" = "160241343420"
          token_response=$(curl -fsS --request POST --data-urlencode "client_id=$GOOGLE_CLIENT_ID" --data-urlencode "client_secret=$GOOGLE_CLIENT_SECRET" --data-urlencode "refresh_token=$GOOGLE_REFRESH_TOKEN" --data-urlencode "grant_type=refresh_token" https://oauth2.googleapis.com/token)
          access_token=$(printf '%s' "$token_response" | jq -r '.access_token // empty')
          test -n "$access_token"
          echo "::add-mask::$access_token"
          expiry=$(date -u -d "+3600 seconds" '+%Y-%m-%dT%H:%M:%SZ')
          token_json=$(jq -cn --arg at "$access_token" --arg rt "$GOOGLE_REFRESH_TOKEN" --arg ex "$expiry" '{access_token:$at,token_type:"Bearer",refresh_token:$rt,expiry:$ex}')
          rclone config create drive drive client_id "$GOOGLE_CLIENT_ID" client_secret "$GOOGLE_CLIENT_SECRET" scope drive token "$token_json" --non-interactive >/dev/null
      - name: Download 20 parts
        run: |
          mkdir -p /tmp/parts
          for n in $(seq -w 0 19); do
            rclone copyto "drive:$PARTS_FOLDER/The_Old_Way_4K_x20_part_${n}.mp4" "/tmp/parts/part_${n}.mp4"
          done
      - name: Merge and upload final
        env:
          PARTS_DIR: /tmp/parts
          FINAL_FILE: /tmp/The_Old_Way_4K_x20.mp4
        run: |
          chmod +x scripts/encode-4k-parallel.sh
          scripts/encode-4k-parallel.sh merge
          rclone copyto "$FINAL_FILE" "drive:$DEST_FOLDER/The_Old_Way_4K_x20.mp4" --stats 10s
      - name: Cleanup parts
        if: success()
        run: |
          for n in $(seq -w 0 19); do rclone deletefile "drive:$PARTS_FOLDER/The_Old_Way_4K_x20_part_${n}.mp4" || true; done
