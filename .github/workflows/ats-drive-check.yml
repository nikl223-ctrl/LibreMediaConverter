name: ATS archive inventory
on:
  workflow_dispatch:
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Download and inspect archive
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: |
          python3 -m pip install --quiet google-auth google-auth-oauthlib google-api-python-client
          python3 - <<'PY'
          import os,io,tarfile,json
          from google.oauth2.credentials import Credentials
          from google.auth.transport.requests import Request
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaIoBaseDownload
          creds=Credentials(None,refresh_token=os.environ['GOOGLE_REFRESH_TOKEN'],token_uri='https://oauth2.googleapis.com/token',client_id=os.environ['GOOGLE_CLIENT_ID'],client_secret=os.environ['GOOGLE_CLIENT_SECRET'])
          creds.refresh(Request())
          service=build('drive','v3',credentials=creds)
          file_id='1Wy4wO6NDJadF7EvZqiu-0zTU-tdiswAq'
          metadata=service.files().get(fileId=file_id,fields='id,name,size,mimeType').execute()
          print('File metadata:',metadata)
          with open('drive-metadata.json','w') as f: json.dump(metadata,f,indent=2)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ats-drive-metadata
          path: drive-metadata.json
