name: Build RoadLife Android APK

on:
  push:
    branches:
      - roadlife-simulator
    paths:
      - "simulator-game/**"
      - ".github/workflows/build-roadlife-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Cache HD game assets
        id: asset-cache
        uses: actions/cache@v4
        with:
          path: simulator-game/assets
          key: roadlife-hd-assets-v2

      - name: Download CC0 4K PBR textures and vehicle audio
        if: steps.asset-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p simulator-game/assets/pbr simulator-game/assets/audio

          fetch_texture () {
            ASSET="$1"
            DIR="simulator-game/assets/pbr/$ASSET"
            mkdir -p "$DIR"
            BASE="https://dl.polyhaven.org/file/ph-assets/Textures/jpg/4k/$ASSET/$ASSET"
            curl --retry 4 --fail --location "$BASE"_diff_4k.jpg   -o "$DIR/$ASSET"_diff_4k.jpg
            curl --retry 4 --fail --location "$BASE"_nor_gl_4k.jpg -o "$DIR/$ASSET"_nor_gl_4k.jpg
            curl --retry 4 --fail --location "$BASE"_rough_4k.jpg  -o "$DIR/$ASSET"_rough_4k.jpg
          }

          fetch_texture asphalt_01
          fetch_texture grass_ground
          fetch_texture concrete_wall_009
          fetch_texture red_brick
          fetch_texture brick_pavement_04

          curl --retry 4 --fail --location "https://opengameart.org/sites/default/files/engine_start_up_01.wav" -o simulator-game/assets/audio/engine_start.wav
          curl --retry 4 --fail --location "https://opengameart.org/sites/default/files/loop_0.wav" -o simulator-game/assets/audio/engine_low.wav
          curl --retry 4 --fail --location "https://opengameart.org/sites/default/files/loop_4.wav" -o simulator-game/assets/audio/engine_high.wav
          curl --retry 4 --fail --location "https://opengameart.org/sites/default/files/car1.wav" -o simulator-game/assets/audio/road.wav
          curl --retry 4 --fail --location "https://opengameart.org/sites/default/files/wind%20woosh%20loop.ogg" -o simulator-game/assets/audio/wind.ogg
          curl --retry 4 --fail --location "https://opengameart.org/sites/default/files/bangs.wav" -o simulator-game/assets/audio/impact.wav

      - name: Cache Blender 5.2.2
        id: blender-cache
        uses: actions/cache@v4
        with:
          path: .cache/blender
          key: blender-5.2.2-linux-x64

      - name: Download Blender 5.2.2 LTS
        if: steps.blender-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .cache/blender
          curl --retry 4 --fail --location             "https://download.blender.org/release/Blender5.2/blender-5.2.2-linux-x64.tar.xz"             -o .cache/blender/blender.tar.xz
          tar -xJf .cache/blender/blender.tar.xz -C .cache/blender
          rm .cache/blender/blender.tar.xz

      - name: Build Blender graphics
        shell: bash
        run: |
          set -euo pipefail
          BLENDER=".cache/blender/blender-5.2.2-linux-x64/blender"
          test -x "$BLENDER"
          "$BLENDER" --background --factory-startup             --python simulator-game/blender/build_assets.py
          echo "Generated Blender/GLB assets:"
          find simulator-game/assets/models simulator-game/blender/generated -maxdepth 1 -type f -printf '%p %k KB\n' | sort

      - name: Pack Blender source files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          zip -9 -j dist/RoadLifeSimulator-BlenderSources.zip simulator-game/blender/generated/*.blend
          ls -lh dist/RoadLifeSimulator-BlenderSources.zip

      - name: Keep Blender sources out of Godot import
        shell: bash
        run: |
          set -euo pipefail
          rm -rf simulator-game/blender/generated
          find simulator-game -type f -name '*.blend' -print
          echo "Godot will import the optimized GLB files only."

      - name: Export with Godot 4.7.2
        id: export
        uses: firebelley/godot-export@v8.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          relative_project_path: ./simulator-game
          presets_to_export: Android
          export_debug: true
          archive_output: false

      - name: Collect APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          APK="$(find "$BUILD_DIR" -type f -name '*.apk' | head -n 1)"
          if [ -z "$APK" ]; then
            echo "No APK was produced."
            find "$BUILD_DIR" -maxdepth 4 -type f -print || true
            exit 1
          fi
          cp "$APK" dist/RoadLifeSimulator-debug.apk
          cp "$APK" dist/RoadLifeSimulator-HD-S24Ultra.apk
          ls -lh dist/RoadLifeSimulator-debug.apk dist/RoadLifeSimulator-HD-S24Ultra.apk
        env:
          BUILD_DIR: ${{ steps.export.outputs.build_directory }}

      - name: Publish rolling HD APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: roadlife-hd-latest
          name: RoadLife Simulator HD - Latest
          prerelease: true
          make_latest: false
          files: |
            dist/RoadLifeSimulator-HD-S24Ultra.apk
            dist/RoadLifeSimulator-BlenderSources.zip
          fail_on_unmatched_files: true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RoadLifeSimulator-APK
          path: dist/RoadLifeSimulator-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Blender source artifact
        uses: actions/upload-artifact@v4
        with:
          name: RoadLifeSimulator-BlenderSources
          path: dist/RoadLifeSimulator-BlenderSources.zip
          if-no-files-found: error
          retention-days: 30
