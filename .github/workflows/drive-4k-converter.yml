name: Drive 4K Video Converter

on:
  workflow_dispatch:
    inputs:
      source:
        description: "Google Drive link or file ID"
        required: true
        type: string
      output_folder:
        description: "Destination folder in Google Drive"
        required: false
        default: "Video Converter/Fertig"
        type: string
      output_name:
        description: "Optional output filename (.mp4)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: drive-video-converter
  cancel-in-progress: false

jobs:
  convert:
    name: Download, convert to 4K HEVC, stream to Drive
    runs-on: ubuntu-latest
    timeout-minutes: 350

    env:
      RCLONE_CONFIG: ${{ runner.temp }}/rclone.conf
      MAX_OUTPUT_BYTES: "10000000000"
      INITIAL_TARGET_BYTES: "9000000000"

    steps:
      - name: Install FFmpeg and rclone
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg rclone jq curl ca-certificates
          ffmpeg -version | head -n 1
          rclone version | head -n 1

      - name: Configure Google Drive securely
        shell: bash
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: |
          set -euo pipefail

          for var in GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET GOOGLE_REFRESH_TOKEN; do
            if [ -z "${!var:-}" ]; then
              echo "::error::GitHub Secret $var is missing."
              exit 1
            fi
          done

          token_response="$(curl -fsS --retry 3 --request POST             --data-urlencode "client_id=$GOOGLE_CLIENT_ID"             --data-urlencode "client_secret=$GOOGLE_CLIENT_SECRET"             --data-urlencode "refresh_token=$GOOGLE_REFRESH_TOKEN"             --data-urlencode "grant_type=refresh_token"             "https://oauth2.googleapis.com/token")"

          access_token="$(printf '%s' "$token_response" | jq -r '.access_token // empty')"
          expires_in="$(printf '%s' "$token_response" | jq -r '.expires_in // 3600')"

          if [ -z "$access_token" ]; then
            echo "::error::Google rejected the OAuth refresh token."
            exit 1
          fi

          echo "::add-mask::$access_token"
          expiry="$(date -u -d "+${expires_in} seconds" '+%Y-%m-%dT%H:%M:%SZ')"
          token_json="$(jq -cn             --arg access "$access_token"             --arg refresh "$GOOGLE_REFRESH_TOKEN"             --arg expiry "$expiry"             '{access_token:$access,token_type:"Bearer",refresh_token:$refresh,expiry:$expiry}')"

          mkdir -p "$(dirname "$RCLONE_CONFIG")"
          touch "$RCLONE_CONFIG"
          chmod 600 "$RCLONE_CONFIG"

          rclone config create drive drive             client_id "$GOOGLE_CLIENT_ID"             client_secret "$GOOGLE_CLIENT_SECRET"             scope drive             token "$token_json"             --non-interactive >/dev/null

          if ! rclone about drive: >/dev/null 2>&1; then
            echo "::error::Google Drive authentication failed."
            exit 1
          fi

      - name: Resolve Google Drive file ID
        id: request
        shell: bash
        env:
          RAW_SOURCE: ${{ inputs.source }}
          DEST_FOLDER: ${{ inputs.output_folder }}
          REQUESTED_NAME: ${{ inputs.output_name }}
        run: |
          set -euo pipefail

          raw="${RAW_SOURCE:-}"
          if [ -z "$raw" ]; then
            echo "::error::No Google Drive link or file ID was supplied."
            exit 1
          fi

          file_id=""
          if [[ "$raw" =~ /d/([^/?]+) ]]; then
            file_id="${BASH_REMATCH[1]}"
          elif [[ "$raw" =~ [\?\&]id=([^\&]+) ]]; then
            file_id="${BASH_REMATCH[1]}"
          elif [[ "$raw" =~ ^[A-Za-z0-9_-]{10,}$ ]]; then
            file_id="$raw"
          else
            echo "::error::Please supply a Google Drive file link or file ID."
            exit 1
          fi

          dest_folder="${DEST_FOLDER:-Video Converter/Fertig}"
          echo "file_id=$file_id" >> "$GITHUB_OUTPUT"
          echo "dest_folder=$dest_folder" >> "$GITHUB_OUTPUT"
          echo "requested_name=${REQUESTED_NAME:-}" >> "$GITHUB_OUTPUT"

      - name: Download source from Google Drive
        id: download
        shell: bash
        env:
          FILE_ID: ${{ steps.request.outputs.file_id }}
        run: |
          set -euo pipefail

          input_dir="$RUNNER_TEMP/video-input"
          mkdir -p "$input_dir"

          echo "Downloading source video from Google Drive..."
          rclone backend copyid drive: "$FILE_ID" "$input_dir/"             --stats 15s             --stats-one-line             --retries 5             --low-level-retries 10

          input_file="$(find "$input_dir" -maxdepth 1 -type f -printf '%T@ %p\n' | sort -nr | head -n 1 | cut -d' ' -f2-)"
          if [ -z "$input_file" ] || [ ! -s "$input_file" ]; then
            echo "::error::The Drive file could not be downloaded."
            exit 1
          fi

          source_size="$(stat -c '%s' "$input_file")"
          echo "Input downloaded: $(( source_size / 1000000 )) MB"
          echo "input_file=$input_file" >> "$GITHUB_OUTPUT"

      - name: Probe video and calculate bitrate
        id: probe
        shell: bash
        env:
          INPUT_FILE: ${{ steps.download.outputs.input_file }}
          REQUESTED_NAME: ${{ steps.request.outputs.requested_name }}
        run: |
          set -euo pipefail

          duration="$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$INPUT_FILE" | head -n 1)"

          if ! python3 -c 'import math,sys; d=float(sys.argv[1]); assert math.isfinite(d) and d > 0' "$duration"; then
            echo "::error::Could not determine video duration."
            exit 1
          fi

          video_bps="$(python3 -c 'import sys; d=float(sys.argv[1]); t=int(sys.argv[2]); a=192000; total=(t*8/d)*0.985; print(max(500000,min(int(total-a),80000000)))' "$duration" "$INITIAL_TARGET_BYTES")"

          base="$(basename "$INPUT_FILE")"
          stem="${base%.*}"

          if [ -n "${REQUESTED_NAME:-}" ]; then
            output_name="$REQUESTED_NAME"
            [[ "$output_name" == *.mp4 ]] || output_name="${output_name}.mp4"
          else
            output_name="${stem}_4K_HEVC.mp4"
          fi

          output_name="$(printf '%s' "$output_name" | tr '/\\\r\n\t' '____')"

          echo "Duration: $(python3 -c 'import sys; print(round(float(sys.argv[1])/60,1))' "$duration") minutes"
          echo "Initial video bitrate: $(( video_bps / 1000 )) kbit/s"
          echo "Output name: $output_name"

          echo "duration=$duration" >> "$GITHUB_OUTPUT"
          echo "video_bps=$video_bps" >> "$GITHUB_OUTPUT"
          echo "output_name=$output_name" >> "$GITHUB_OUTPUT"

      - name: Convert to 4K HEVC and stream directly to Drive
        id: convert
        shell: bash
        env:
          INPUT_FILE: ${{ steps.download.outputs.input_file }}
          DEST_FOLDER: ${{ steps.request.outputs.dest_folder }}
          OUTPUT_NAME: ${{ steps.probe.outputs.output_name }}
          INITIAL_VIDEO_BPS: ${{ steps.probe.outputs.video_bps }}
        run: |
          set -euo pipefail

          dest_path="${DEST_FOLDER%/}/$OUTPUT_NAME"
          rclone mkdir "drive:${DEST_FOLDER%/}"

          bitrate="$INITIAL_VIDEO_BPS"
          final_size=0
          success=0

          for attempt in 1 2 3; do
            maxrate=$(( bitrate * 12 / 10 ))
            bufsize=$(( bitrate * 2 ))

            echo "Conversion attempt $attempt of 3 at $(( bitrate / 1000 )) kbit/s"
            echo "FFmpeg output is being streamed to Google Drive while encoding."

            set +e
            ffmpeg -hide_banner -loglevel warning -stats -y               -i "$INPUT_FILE"               -map 0:v:0 -map '0:a?'               -vf "scale=3840:2160:force_original_aspect_ratio=decrease,pad=3840:2160:(ow-iw)/2:(oh-ih)/2,setsar=1"               -c:v libx265 -preset veryfast -pix_fmt yuv420p               -b:v "$bitrate" -maxrate "$maxrate" -bufsize "$bufsize"               -c:a aac -b:a 192k               -movflags +frag_keyframe+empty_moov+default_base_moof               -f mp4 pipe:1             | rclone rcat "drive:$dest_path"                 --drive-chunk-size 64M                 --streaming-upload-cutoff 1M                 --stats 15s                 --stats-one-line                 --retries 5                 --low-level-retries 20
            pipe_status=( "${PIPESTATUS[@]}" )
            set -e

            if [ "${pipe_status[0]}" -ne 0 ] || [ "${pipe_status[1]}" -ne 0 ]; then
              rclone deletefile "drive:$dest_path" >/dev/null 2>&1 || true
              echo "::error::FFmpeg or the Drive upload failed."
              exit 1
            fi

            final_size="$(rclone size --json "drive:$dest_path" | jq -r '.bytes // 0')"
            echo "Uploaded size: $(( final_size / 1000000 )) MB"

            if [ "$final_size" -gt 0 ] && [ "$final_size" -le "$MAX_OUTPUT_BYTES" ]; then
              success=1
              break
            fi

            echo "::warning::Output exceeded 10 GB. Deleting it and lowering bitrate."
            rclone deletefile "drive:$dest_path" || true
            bitrate="$(python3 -c 'import sys; b=int(sys.argv[1]); s=max(1,int(sys.argv[2])); print(max(500000,int(b*(9200000000/s))))' "$bitrate" "$final_size")"
          done

          if [ "$success" -ne 1 ]; then
            rclone deletefile "drive:$dest_path" >/dev/null 2>&1 || true
            echo "::error::Could not produce a file at or below 10 GB after three attempts."
            exit 1
          fi

          echo "final_size=$final_size" >> "$GITHUB_OUTPUT"
          echo "final_bitrate=$bitrate" >> "$GITHUB_OUTPUT"
          echo "dest_path=$dest_path" >> "$GITHUB_OUTPUT"

      - name: Summary
        shell: bash
        env:
          DEST_PATH: ${{ steps.convert.outputs.dest_path }}
          FINAL_SIZE: ${{ steps.convert.outputs.final_size }}
          FINAL_BITRATE: ${{ steps.convert.outputs.final_bitrate }}
        run: |
          set -euo pipefail

          size_gb="$(python3 -c 'import sys; print(round(int(sys.argv[1])/1000000000,3))' "$FINAL_SIZE")"
          bitrate_mbps="$(python3 -c 'import sys; print(round(int(sys.argv[1])/1000000,2))' "$FINAL_BITRATE")"

          {
            echo "## 4K video conversion finished"
            echo
            echo "- **Google Drive:** \`$DEST_PATH\`"
            echo "- **Output size:** $size_gb GB"
            echo "- **Video bitrate:** $bitrate_mbps Mbit/s"
            echo "- **Video:** 3840x2160 HEVC/H.265"
            echo "- **Audio:** AAC 192 kbit/s"
            echo "- **Maximum file size:** 10 GB"
          } >> "$GITHUB_STEP_SUMMARY"
