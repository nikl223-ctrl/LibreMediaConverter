name: Cancel H264 worker

on:
  push:
    branches:
      - main
    paths:
      - "cancel-h264-run.txt"

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cancel requested runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          mapfile -t run_ids < <(grep -Eo '[0-9]{8,}' cancel-h264-run.txt || true)
          if [ "${#run_ids[@]}" -eq 0 ]; then
            echo "::error::No run ids found."
            exit 1
          fi

          failed=0
          for run_id in "${run_ids[@]}"; do
            echo "Cancelling run $run_id"
            code=$(curl -sS -o "/tmp/cancel-$run_id.txt" -w '%{http_code}'               -X POST               -H "Accept: application/vnd.github+json"               -H "Authorization: Bearer $GH_TOKEN"               -H "X-GitHub-Api-Version: 2022-11-28"               "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/$run_id/cancel")

            echo "Run $run_id cancel HTTP status: $code"
            if [ "$code" != "202" ] && [ "$code" != "409" ]; then
              cat "/tmp/cancel-$run_id.txt" || true
              failed=1
            fi
          done

          exit "$failed"
