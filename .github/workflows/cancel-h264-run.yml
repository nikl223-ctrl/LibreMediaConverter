name: Cancel H264 worker

on:
  push:
    branches:
      - main
    paths:
      - "cancel-h264-run.txt"

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cancel requested H264 run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_id=$(tr -dc '0-9' < cancel-h264-run.txt)
          if [ -z "$run_id" ]; then
            echo "::error::No run id found."
            exit 1
          fi
          echo "Cancelling run $run_id"
          code=$(curl -sS -o /tmp/cancel-response.txt -w '%{http_code}' \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/$run_id/cancel")
          echo "GitHub cancel HTTP status: $code"
          if [ "$code" != "202" ] && [ "$code" != "409" ]; then
            cat /tmp/cancel-response.txt
            exit 1
          fi
