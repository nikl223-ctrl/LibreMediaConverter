name: Cancel old H264 worker

on:
  push:
    branches:
      - main
    paths:
      - "cancel-h264-run.txt"

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel old Der Lorax run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/cancel-response.txt -w '%{http_code}'             -X POST             -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer $GH_TOKEN"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/nikl223-ctrl/LibreMediaConverter/actions/runs/37236729534/cancel")
          echo "GitHub cancel HTTP status: $code"
          if [ "$code" != "202" ] && [ "$code" != "409" ]; then
            cat /tmp/cancel-response.txt
            exit 1
          fi
